# Vibe-Research v1.0 Docker Compose
# 使用方式：
#   docker compose up -d

services:
  vibe-research:
    image: birdxs/vibe-research:latest
    container_name: vibe-research-v2
    restart: unless-stopped
    ports:
      - "5898:80"
    environment:
      - VRA_DATA_ROOT=/data
      - VRA_API_TOKEN=fdf2c8356f52b9be8561bfe601a50e38
      - VRA_ALLOWED_ORIGINS=https://vibe-research-v2.birdxs.fun:89
    volumes:
      - ./vibe-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

    networks:
      - 1panel-network

networks:
  1panel-network:
    external: true
